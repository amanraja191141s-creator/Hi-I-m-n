name: SA Calculator Tools Only Android APK v100.29

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tools-only-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # The ZIP contains a top-level project folder. Some repository uploads
      # preserve that folder instead of placing package.json at repository root.
      # Resolve the actual app root once and use it for every app command.
      - name: Extract uploaded project ZIP and locate project root
        id: project-root
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_DIR="$RUNNER_TEMP/sa-calculator-source"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          # IMPORTANT: the uploaded release ZIP is authoritative. Never prefer
          # an older package.json already present in the checked-out repository.
          mapfile -d '' archives < <(find "$WORKSPACE" -maxdepth 3 -type f \
            -name 'SA-Calculator-Tools-Only-v100.29*.zip' -not -path '*/.git/*' -print0 | sort -z -V)
          if [[ ${#archives[@]} -gt 0 ]]; then
            archive="${archives[-1]}"
            echo "Using uploaded release archive: $archive"
            command -v unzip >/dev/null || { echo '::error::unzip is unavailable'; exit 1; }
            unzip -q "$archive" -d "$EXTRACT_DIR"
            SEARCH_ROOT="$EXTRACT_DIR"
          else
            echo 'No release ZIP found; using checked-out project files as fallback.'
            SEARCH_ROOT="$WORKSPACE"
          fi

          matches=()
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            if [[ -s "$dir/capacitor.config.json" && -s "$dir/index.html" ]] && \
               node -e "const p=require(process.argv[1]); process.exit(p.name==='sa-calculator'?0:1)" "$file"; then
              matches+=("$dir")
            fi
          done < <(find "$SEARCH_ROOT" -maxdepth 8 -type f -name package.json \
            -not -path '*/node_modules/*' -not -path '*/android/.gradle/*' \
            -not -path '*/.git/*' -print0)

          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one SA Calculator project root in authoritative source; found ${#matches[@]}"
            echo "Search root: $SEARCH_ROOT"
            find "$SEARCH_ROOT" -maxdepth 8 -type f \
              \( -name package.json -o -name capacitor.config.json -o -name index.html \) \
              -not -path '*/node_modules/*' -print | sort || true
            exit 1
          fi

          PROJECT_DIR="${matches[0]}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Resolved authoritative project root: $PROJECT_DIR"
          node -e "const p=require(process.argv[1]); console.log('Selected release:',p.version,'Android code:',p.androidVersionCode)" "$PROJECT_DIR/package.json"
          test -s "$PROJECT_DIR/package.json"
          test -s "$PROJECT_DIR/capacitor.config.json"
          test -s "$PROJECT_DIR/index.html"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache npm package downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-node22-${{ hashFiles('**/package.json', '**/SA-Calculator-Tools-Only*.zip') }}
          restore-keys: |
            ${{ runner.os }}-npm-node22-

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      # Avoid the legacy Android SDK setup action here.
      # The supplied run log proves that action tries to install the obsolete
      # SDK package named "tools", which sdkmanager now rejects.
      - name: Configure preinstalled Android SDK and install exact build packages
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version

          # License acceptance is non-interactive; tolerate sdkmanager's
          # expected SIGPIPE after all licenses have been written.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -d "$SDK_ROOT/platforms/android-35"
          "$SDK_ROOT/build-tools/35.0.0/aapt" version

      - name: Verify tools-only release identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const expected='2.0.27-v100.29';
          if(p.name!=='sa-calculator'||p.version!==expected||p.androidVersionCode!==1099169) throw new Error(`Release identity mismatch: found name=${p.name}, version=${p.version}, androidVersionCode=${p.androidVersionCode}; expected sa-calculator/${expected}/1099169`);
          if(!p.scripts['android:setup'].includes('npx cap add android')||!p.scripts['android:setup'].includes('npx cap sync android')) throw new Error('Android setup script is incomplete');
          for(const f of ['index.html','manifest.webmanifest','service-worker.js','assets/js/app.js','assets/css/tools-only.css','assets/css/tool-parity-v10017.css','assets/css/all-tools-video-parity-v10025.css','assets/css/unit-video-parity-v10026.css','assets/css/recording-audit-v10027.css','assets/css/final-device-parity-v10028.css','assets/css/final-device-parity-v10029.css','scripts/prepare-android-web.mjs','scripts/patch-android-native.mjs','capacitor.config.json','tests/tools-only-release.test.mjs','tests/all-tools-video-audit-v10025.test.mjs']) if(!fs.existsSync(f)||!fs.statSync(f).size) throw new Error(`Missing required file: ${f}`);
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/class="tool-launch-item"[^>]*data-tool-screen="([^"]+)"/g)].map(x=>x[1]);
          if(ids.length!==12||new Set(ids).size!==12) throw new Error(`Expected 12 unique tools; found ${ids.length}`);
          if(JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')).version!==expected) throw new Error('Manifest version mismatch');
          if(JSON.parse(fs.readFileSync('capacitor.config.json','utf8')).webDir!=='www') throw new Error('Capacitor webDir must be www');
          console.log(`Release verified: ${expected}; ${ids.length} tools.`);
          NODE

      - name: Install pinned Capacitor dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-package-lock --no-audit --no-fund --fetch-retries=5 --fetch-timeout=180000

      - name: Validate JavaScript syntax
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check assets/js/app.js
          node --check assets/js/localization.js
          node --check assets/js/theme-bootstrap.js
          node --check service-worker.js
          node --check server.js
          node --check scripts/prepare-android-web.mjs
          node --check scripts/patch-android-native.mjs

      - name: Prepare Android web assets for regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build:web

      - name: Run regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run test:release

      - name: Generate Android project, sync web assets and apply native configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run android:setup

      - name: Verify generated Android project and Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s android/settings.gradle || test -s android/settings.gradle.kts
          test -s android/app/build.gradle || test -s android/app/build.gradle.kts
          test -s android/gradlew
          chmod +x android/gradlew
          test -s android/app/src/main/AndroidManifest.xml
          find android/app/src/main -name MainActivity.java -print -quit | grep -q .
          test -s www/index.html
          test -s www/assets/css/tools-only.css
          test -s android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure memory-safe incremental Android build
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .
          cat > gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPERTIES
          echo 'Gradle incremental build, build cache and bounded worker settings enabled.'
          cat gradle.properties

      - name: Build debug APK
        timeout-minutes: 25
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -Eeuo pipefail
          START=$SECONDS
          ./gradlew --build-cache --parallel --max-workers=2 --stacktrace --console=plain --warning-mode=summary assembleDebug
          echo "Gradle assembleDebug elapsed: $((SECONDS - START)) seconds"

      - name: Verify APK and package metadata
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='com.sacalculator.app'" /tmp/apk-badging.txt
          grep -F "versionCode='1099169'" /tmp/apk-badging.txt
          sha256sum "$APK"
          echo "Verified APK absolute path: $PROJECT_DIR/$APK"
          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
          test -s "$PROJECT_DIR/$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SA-Calculator-Tools-Only-v100.29-debug-apk
          # upload-artifact resolves relative paths from GITHUB_WORKSPACE, not working-directory.
          # Use the absolute path because PROJECT_DIR is under RUNNER_TEMP after ZIP extraction.
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
